# ─────────────────────────────────────────────────────────────
#  Save this file at:  .github/workflows/snake.yml
#  in your LOSTCODE160/LOSTCODE160 profile repository.
#
#  One-time setup after committing:
#    Settings → Actions → General → Workflow permissions
#    → select "Read and write permissions" → Save
#
#  Then: Actions tab → "Generate Snake" → Run workflow
#  It will create an `output` branch holding snake.svg.
# ─────────────────────────────────────────────────────────────

name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # manual trigger button
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=#C084FC&color_dots=#0D0D0D,#3B1E63,#7C3AED,#A855F7,#FF6B9D

      - name: Push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
